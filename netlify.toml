[build]
  command = "npm run build"
  publish = "dist/barefoot-nomad-fe"

[[redirects]]
  from = "/api/*"
  to = "http://ec2-13-203-184-215.ap-south-1.compute.amazonaws.com:3000/api/:splat"
  status = 200
  force = true
  signed = "API_SIGNATURE_TOKEN"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
